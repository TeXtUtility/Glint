<!-- The DMG window background. Rendered at 600x360 and 1200x720 and joined with tiffutil -cathidpicheck into dmg-background.tiff. -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 600px; height: 360px; overflow: hidden; }
  body { background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #1d1d22; position: relative; }
  h1 { position: absolute; top: 24px; left: 0; right: 0; margin: 0; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
  h1 span { color: #e5333d; }
  .arrow { position: absolute; left: 228px; top: 113px; width: 144px; height: 34px; }
  .help { position: absolute; left: 32px; right: 32px; top: 222px; padding: 14px 18px; border-radius: 12px; background: #ffffff; border: 1px solid #e3e3e8; display: flex; gap: 14px; align-items: flex-start; }
  .help svg { flex: none; width: 22px; height: 22px; color: #e5333d; margin-top: 1px; }
  .help b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .help p { margin: 0; font-size: 12px; line-height: 17px; color: #55555f; }
  .help em { font-style: normal; color: #1d1d22; font-weight: 500; }
</style></head><body>
  <h1>Drag <span>Glint</span> into Applications</h1>
  <svg class="arrow" viewBox="0 0 144 34" fill="none" stroke="#e5333d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h132M120 4l16 13-16 13"/></svg>
  <div class="help">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
    <div><b>Opening it the first time</b><p>Glint isn't notarized by Apple, so macOS says it can't check it. Click Done, then open <em>System Settings → Privacy &amp; Security</em>, scroll down and click <em>Open Anyway</em>. You only do this once.</p></div>
  </div>
</body></html>
