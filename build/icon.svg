<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A glint inside a white ring. macOS grid: 824 px rounded square on a 1024 canvas. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#161618" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-width="48"/>
  <path d="M564 345 A175 175 0 0 1 679 470" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
</svg>
