# Releases make themselves: when main gets a version that has no GitHub release yet (a "Release x.y.z" commit), this
# builds a DMG for each kind of Mac and a Windows setup file, then publishes the release, tagged on that commit, with
# the version's changelog section as its notes. Run by hand with a tag to rebuild that release's installers.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose installers to rebuild (e.g. v0.16.2)
        required: true

permissions:
  contents: write # create the release and attach the installers

concurrency:
  group: release-${{ inputs.tag || github.sha }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ -n "$INPUT_TAG" ]]; then
            [[ "$INPUT_TAG" == "$tag" ]] || { echo "::error::$INPUT_TAG is tagged, but its package.json says $tag"; exit 1; }
            build=true
          elif gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false # released already: this push didn't change the version
          else
            build=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          # Each on its own machine: npm installs the speech models' native libraries for the system it runs on.
          - { os: macos-latest, target: --mac dmg --arm64 }
          - { os: macos-15-intel, target: --mac dmg --x64 }
          - { os: windows-latest, target: --win nsis --x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          GLINT_RELEASE: '1' # updates from the release's installers, not by rebuilding from source
      - name: Package
        shell: bash
        env:
          # Optional. Without them the Mac app is signed ad hoc and the Windows installer is unsigned: both open, after
          # a first-launch warning. With an Apple Developer ID the DMG is signed and notarized.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          sign=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then sign=(-c.mac.identity="$APPLE_SIGNING_IDENTITY" -c.mac.notarize=true)
            else unset CSC_LINK CSC_KEY_PASSWORD; sign=(-c.mac.identity=-); fi
          elif [[ -z "$WIN_CSC_LINK" ]]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npx electron-builder ${{ matrix.target }} --publish never "${sign[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/Glint-*.dmg
            dist/Glint-*.exe
          if-no-files-found: error

  # Only once every installer is built, so a release never appears with some missing.
  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          # The changelog's section for this version, without its heading.
          awk -v h="## $version " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "Glint $version" > notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber -R "$GITHUB_REPOSITORY"
            # Installers this build no longer makes (renamed or dropped) go.
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
              [[ -e "installers/$name" ]] || gh release delete-asset "$TAG" "$name" -y -R "$GITHUB_REPOSITORY"
            done
          else
            gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "Glint $version" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi
